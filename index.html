<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      crossorigin="anonymous" referrerpolicy="no-referrer" />

      <!--<link rel="stylesheet" href="assets/css/bootstrap.min.css">-->
      <link rel="stylesheet" href="donor.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>DONOR</title>

</head>
<body>
  <div class="my-dashboard">
  
<!-- Navbar -->
 
<nav class="navbar navbar-expand-lg shadow-sm px-5 pb-3">
  <div class="buttons">
    <button class="btn btn-outline-warning px-3 p-1.5 mt-1" onclick="window.location.href='login.html'">دخول</button>
    <button class="btn btn-warning btn-sm px-4 p-2 mt-1 mx-2 control-btn" onclick="window.location.href='register.html'" >حساب جديد</button>
  </div>
  
  <div class="collapse navbar-collapse navbar-collapse" id="mainNav">
  <ul class="navbar-nav">
    <li class="nav-item fw-bold"><a class="nav-link" href="#">تواصل معنا</a></li>
    <li class="nav-item fw-bold"><a class="nav-link" href="#">عن المنصة</a></li>
    <li class="nav-item fw-bold"><a class="nav-link" href="#">الجمعيات</a></li>
    <li class="nav-item fw-bold"><a class="nav-link" href="#">الرئيسية</a></li>
  </ul>
</div>

 <a class="navbar-brand fw-bold " href="#"><img src ="images/logo.jpeg" alt="عطاء" height="55px" class="rounded-circle"></a>

   <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
  <span class="navbar-toggler-icon"></span>
</button>
</nav>

<!-- Content -->
<div class="container py-5">
  <div class="row g-4">

    
    <div class="col-md-8">
      <!-- Table Card -->
      <div class="card shadow-sm border-0 p-4">
        <h5 class="mb-4 fw-bold">تبرعاتي السابقة</h5>
        <div class="table-responsive">
          <table class="table align-middle text-center">
            <thead class="table">
              <tr>
                <th>التاريخ</th>
                <th>الحالة</th>
                <th>العدد</th>
                <th>المقاس</th>
                <th>النوع</th>
              </tr>
            </thead>
            <tbody id="userdonationsTable">
            </tbody>
          </table>
        </div>
      </div>

      <!-- Chart Card -->
      <div class="card shadow-sm p-4 mt-3 smart-widget">
        <h5 class="mb-4 mx-2">📊 حالة التبرعات في المنصة</h5>

        <!-- Trust -->
        <div class="mb-4 my-1">
          <h6>نسبة المتبرعين النشطين</h6>
          <div class="progress">
            <div id="trustBar" class="progress-bar bg-success" style="width:0%">0%</div>
          </div>
        </div>


        <!-- Sizes -->
        <div class="text-center mb-4">
          <h6>📏 المقاسات المطلوبة حالياً</h6>
          <div id="sizesBox" class="sizes-box mt-2"></div>
        </div>

        <canvas id="myChart" style="margin-top:20px;"></canvas>
      </div>

    </div> 

    
    <div class="col-md-4">
      <h3 class="mb-3 fw-bold">لوحة تحكم المتبرع</h3>

      <div class="card shadow-sm border-0 p-4" id="donationform">
        <h4 class="mb-4 fw-bold">اضافة تبرع جديد</h4>

        <label class="form-label1 mb-1 fw-bold">نوع الملابس</label>
        <select id="clothingType" class="form-select mb-3">
          <option value="men">رجالي</option>
          <option value="women">حريمي</option>
          <option value="kids">أطفال</option>
        </select>

        <label class="form-label2 mb-1 fw-bold">المقاس</label>
        <select id="size" class="form-select mb-3">
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
          <option value="kids-2">اطفال (سنتين)</option>
          <option value="kids-5">اطفال (5 سنوات)</option>
          <option value="kids-10">اطفال (10 سنوات)</option>
        </select>

        <label class="form-label3 mb-1 fw-bold">الحالة</label>
        <select id="condition" class="form-select mb-3">
          <option value="new">جديد</option>
          <option value="like-new">شبه جديد</option>
          <option value="good">مستعمل بحالة جيدة</option>
        </select>

        <label class="form-label4 mb-1 fw-bold">العدد</label>
        <input type="number" id="quantity" class="form-control mb-4" value="1" min="1">

        <button type="button" id="donorAPI" class="btn btn-warning w-100" onclick="sendDonation()">إرسال التبرع</button>

        <div id="responseMesage" class="mt-3" style="display:none;"></div>
      </div>
    </div> 

  </div> 
</div> 
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
       <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
       
       <script src="donor.js"></script>

     </body>
     </html>
